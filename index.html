if(r.startsWith&&!t.trim().startsWith(r.startsWith))p.push('必須以指定開頭句開始');
if(r.quote){const b=[...t.matchAll(/[「"“]([^」"”]*)[」"”]/g)].filter(m=>cnt(m[1])>r.quote);if(b.length)p.push('有 '+b.length+' 句台詞超過 '+r.quote+' 字:「'+b[0][1]+'」')}
if(r.lines){const l=t.split('\n').filter(x=>x.trim()).length;if(l!==r.lines)p.push('需剛好 '+r.lines+' 行,目前 '+l+' 行')}
if(r.paras){const l=t.split(/\n\s*\n/).filter(x=>x.trim()).length;if(l<r.paras)p.push('至少分 '+r.paras+' 段(以空行分隔),目前 '+l)}
if(r.must){const m=r.must.filter(w=>!t.includes(w));if(m.length)p.push('還缺少詞語:'+m.join('、'))}
if(r.timer&&!ts.done)p.push(ts.run?'時間到才能提交':'按下「開始計時」');
return p}
function upd(){const t=$('t').value,n=cnt(t),r=g.r,p=check(t,n),tg=r.exact||r.min||r.max||0;
$('n').textContent=n+' 字'+(tg?' / '+tg:'');$('bf').style.width=Math.min(100,tg?n/tg*100:0)+'%';
$('m').className=p.length?'':'ok';$('m').innerHTML=p.length?p.map(esc).join('<br>'):'✓ 符合規則,可以提交';$('sv').disabled=p.length>0||!n}
function submit(){const t=$('t').value,e=load();e.push({id:Date.now(),cid:cur[0],date:day(),prompt:g.p+(g.s?'\n'+g.s:''),text:t,n:cnt(t)});save(e);clear();stats();
$('app').innerHTML='<div class="pr">✅ 已存檔!今天又完成了一篇「'+cur[2]+'」。</div><button class="p" id="a1">再抽一題</button> <button id="a2">回到挑戰列表</button>';$('a1').onclick=()=>open(cur[0],1);$('a2').onclick=home}
function cpy(t,b){const o=b.textContent,ok=()=>{b.textContent='已複製 ✓';setTimeout(()=>b.textContent=o,1500)},fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')&&ok()}catch(_){}a.remove()};try{navigator.clipboard.writeText(t).then(ok,fb)}catch(_){fb()}}
function hist(){clear();const e=load().reverse();
$('app').innerHTML='<div class="row"><button id="bb">📦 盲盒:隨機重讀一篇舊作</button><button id="cp">複製全部</button></div><div id="bx"></div>'+(e.length?e.map(x=>'<details><summary>'+esc(C.find(c=>c[0]==x.cid)[2])+' · '+x.date+' · '+x.n+' 字</summary><div class="st" style="white-space:pre-line">'+esc(x.prompt)+'</div><pre>'+esc(x.text)+'</pre><button data-cp="'+x.id+'">複製單篇</button> <button data-d="'+x.id+'">刪除</button></details>').join(''):'<p class="st">還沒有作品,去挑戰一下吧。</p>');
$('bb').onclick=()=>{const x=R(e.length?e:[null]);$('bx').innerHTML=x?'<div class="pr"><small>'+x.date+' · '+esc(C.find(c=>c[0]==x.cid)[2])+'</small><pre>'+esc(x.text)+'</pre></div>':'<p class="st">還沒有作品。</p>'};
$('cp').onclick=()=>{try{navigator.clipboard.writeText(e.map(x=>'【'+x.date+' '+C.find(c=>c[0]==x.cid)[2]+'】\n'+x.text).join('\n\n---\n\n'));$('cp').textContent='已複製 ✓'}catch(_){}};
$('app').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(!b.dataset.s){b.dataset.s=1;b.textContent='再按一次確認刪除';b.classList.add('p');setTimeout(()=>{if(b.isConnected){delete b.dataset.s;b.textContent='刪除';b.classList.remove('p')}},3000);return}save(load().filter(x=>x.id!=b.dataset.d));stats();hist()});
$('app').querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{const x=e.find(y=>y.id==b.dataset.cp);if(x)cpy('【'+x.date+' '+C.find(c=>c[0]==x.cid)[2]+'】\n'+x.text,b)})}
$('t1').onclick=()=>{$('t1').classList.add('on');$('t2').classList.remove('on');home()};
$('t2').onclick=()=>{$('t2').classList.add('on');$('t1').classList.remove('on');hist()};
$('t3').onclick=()=>open(R(C)[0]);
stats();home();
</script></body></html>
